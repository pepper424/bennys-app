<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bennys - never let a credit die</title>
  <meta name="description"
        content="Track every credit card benefit, credit, and free night you are owed - with deadlines and one-tap tracking.">
  <meta name="theme-color" content="#0C0F16">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bennys">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="hero" style="padding-top:4rem">
    <div class="hero-name">Bennys</div>
    <div class="hero-sub">Loading&hellip;</div>
  </div></div>
  <div id="toast" class="toast"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      // If a controller already exists, a controller change means a NEW
      // version just took over - reload once so the user sees it now.
      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;
      if (hadController) {
        navigator.serviceWorker.addEventListener("controllerchange",
          function () {
            if (reloading) return;
            reloading = true;
            location.reload();
          });
      }
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          // Check again whenever the app is brought back to the front.
          document.addEventListener("visibilitychange", function () {
            if (!document.hidden) { try { reg.update(); } catch (e) {} }
          });
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
